
name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:

    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v4
    - run: docker build . -t zaki4u/next-js-app
    - run: echo "${{Buzurga@123}}" | docker login -u ${{zaki4u}} --password-stdin 
    - run: docker push zaki4u/next-js-app:latest
